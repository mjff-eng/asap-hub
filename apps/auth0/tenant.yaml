pages:
  - name: login
    enabled: true
    html: '../##APPLICATION_NAME##-auth-frontend/dist/index.html'
actions:
  - name: Add Metadata
    code: ./build/post-login-add-metadata.js
    dependencies:
      - name: got
      - name: '@babel/runtime-corejs3'
    deployed: true
    runtime: node18-actions
    secrets:
      - name: AUTH0_ADDITIONAL_CLAIM_DOMAIN
        value: '##AUTH0_ADDITIONAL_CLAIM_DOMAIN##'
      - name: DEMO_CLIENT_ID
        value: '##DEMO_CLIENT_ID##'
      - name: AUTH0_SHARED_SECRET
        value: '##AUTH0_SHARED_SECRET##'
      - name: API_URL
        value: '##API_URL##'
      - name: BASE_PR_APP_DOMAIN
        value: '##BASE_PR_APP_DOMAIN##'
    status: built
    supported_triggers:
      - id: post-login
        version: v3
  - name: Connect User
    code: ./build/post-login-connect-user.js
    dependencies:
      - name: got
      - name: '@babel/runtime-corejs3'
    deployed: true
    runtime: node18-actions
    secrets:
      - name: AUTH0_ADDITIONAL_CLAIM_DOMAIN
        value: '##AUTH0_ADDITIONAL_CLAIM_DOMAIN##'
      - name: AUTH0_SHARED_SECRET
        value: '##AUTH0_SHARED_SECRET##'
      - name: API_URL
        value: '##API_URL##'
      - name: BASE_PR_APP_DOMAIN
        value: '##BASE_PR_APP_DOMAIN##'
    status: built
    supported_triggers:
      - id: post-login
        version: v3
triggers:
  post-login:
    - action_name: Connect User
      display_name: Connect User
    - action_name: Add Metadata
      display_name: Add Metadata
