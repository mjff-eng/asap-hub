name: Migrate user labs
on:
  workflow_dispatch:
    inputs:
      environment-name:
        required: true
        description: The environment name
        type: choice
        options:
          - Branch
          - Development
          - Production
      contentful-env:
        required: true
        type: string
        description: Choose the Contentful environment to migrate user labs
      dry-run:
        required: true
        type: boolean
        description: Preview the changes without writing to Contentful
        default: true

jobs:
  migrate_user_labs:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment-name }}
    container:
      image: ghcr.io/mjff-eng/asap-hub/node-python-sq:d3833b1f3c7b1ab66ac2446cc61175fddedcee9e
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        id: setup
        uses: ./.github/actions/setup-environment
        with:
          environment-name: ${{ inputs.environment-name }}
      - name: Run User Labs Migration
        run: |
          yarn workspace @asap-hub/contentful migrate-user-labs
        env:
          CONTENTFUL_MANAGEMENT_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}
          CONTENTFUL_SPACE_ID: ${{ steps.setup.outputs.crn-contentful-space-id }}
          CONTENTFUL_ENV_ID: ${{ inputs.contentful-env }}
          DRY_RUN: ${{ inputs.dry-run }}
      - name: Upload backup and report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: migrate-user-labs-${{ inputs.contentful-env }}-${{ github.run_number }}
          path: packages/contentful/scripts/lab-memberships-*.json
          if-no-files-found: warn
          retention-days: 30

  notify_failure:
    runs-on: ubuntu-latest
    needs: [migrate_user_labs]
    if: ${{ failure() && inputs.environment-name=='Production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/slack/
        with:
          message: Migrate user labs failed
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          status: failure
