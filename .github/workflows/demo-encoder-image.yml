name: Demo encoder image

# render.ts bundles @asap-hub/demo-timeline, so a change to the shared package
# changes the image just as much as a change to the encoder directory does
on:
  push:
    branches:
      - master
    paths:
      - 'apps/demo-server/encoder/**'
      - 'packages/demo-timeline/**'
      - '.github/workflows/demo-encoder-image.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'apps/demo-server/encoder/**'
      - 'packages/demo-timeline/**'
      - '.github/workflows/demo-encoder-image.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Development is protected to master; PR runs deploy via the Branch environment
    environment: ${{ github.event_name == 'pull_request' && 'Branch' || 'Development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        id: setup
        uses: ./.github/actions/setup-environment
        with:
          environment-name: ${{ github.event_name == 'pull_request' && 'Branch' || 'Development' }}
      # dist/render.js is generated and gitignored, so the Dockerfile's COPY has
      # nothing to find unless the bundle is built here first
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build the render bundle
        run: |
          corepack enable
          yarn install --immutable
          yarn workspaces foreach -vptR --from '@asap-hub/demo-timeline' run build:babel
          yarn workspace @asap-hub/demo-server build:encoder
          test -s apps/demo-server/encoder/dist/render.js
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.setup.outputs.aws-region }}
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      # the repository is created by the demo-hub CloudFormation stack; on the
      # very first pipeline run it does not exist yet, so skip instead of fail
      # and re-run this workflow once demo-sls-deploy has succeeded
      - name: Check repository exists
        id: repo
        run: |
          if aws ecr describe-repositories --repository-names demo-hub-dev-encoder > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ECR repository demo-hub-dev-encoder does not exist yet (first stack deploy pending). Re-run this workflow after demo-sls-deploy succeeds."
          fi
      # PRs push too: the demo stack is a single shared dev environment, and a
      # PR that changes the encoder deploys to it anyway
      - name: Build and push
        if: steps.repo.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: apps/demo-server/encoder
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/demo-hub-dev-encoder:latest
