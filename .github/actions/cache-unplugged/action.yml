name: 'Cache unplugged'
description: 'Restore .yarn/unplugged from cache, or run yarn rebuild when the cache is missing'
runs:
  using: 'composite'
  steps:
    - id: cache
      uses: actions/cache@v4
      with:
        path: |
          .yarn/unplugged/
        key: unplugged-${{ runner.os }}-${{ hashFiles('yarn.lock', '.yarnrc.yml', '.github/Dockerfile') }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: yarn rebuild
