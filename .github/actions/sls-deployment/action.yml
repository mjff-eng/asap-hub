name: sls deploy action
description: Reusable sls deploy

inputs:
  active-campaign-account:
    description: 'Active Campaign Account'
    required: true
  active-campaign-token:
    description: 'Active Campaign Token'
    required: true
  algolia-index:
    description: 'Algolia index name'
    required: true
  app:
    description: 'Server application name'
    required: true
  auth0-audience:
    description: 'Auth0 Audience'
    required: true
  auth0-client-id:
    description: 'Auth0 Client ID'
    required: true
  auth0-shared-secret:
    description: 'Auth0 Shared Secret'
    required: true
  aws-access-key-id:
    description: 'AWS Access Key ID'
    required: true
  aws-acm-certificate-arn:
    description: 'Arn for AWS ACM Certificate'
    required: true
  aws-region:
    description: 'AWS Region'
    required: true
  aws-secret-access-key:
    description: 'AWS Secret Access Key'
    required: true
  contentful-access-token:
    description: 'Contentful Access Token'
    required: true
  contentful-env:
    description: 'Contentful Environment'
    required: true
  contentful-management-access-token:
    description: 'Contentful Management Access Token'
    required: true
  contentful-preview-access-token:
    description: 'Contentful Preview Access Token'
    required: true
  contentful-space-id:
    description: 'Contentful Space ID'
    required: true
  contentful-webhook-authentication-token:
    description: 'Contentful Webhook Authentication Token'
    required: true
  environment-name:
    description: 'The environment name'
    required: true
  hostname:
    description: 'Hostname'
    required: true
  openai-api-key:
    description: 'OpenAI API Key'
    required: true
  postmark-server-token:
    description: 'Postmark Server Token'
    required: false
  sentry-dsn-api:
    description: 'Sentry DSN for the API'
    required: true
  sentry-dsn-public-api:
    description: 'Sentry DSN for the Public API'
    required: true
  sentry-dsn-handlers:
    description: 'Sentry DSN for handlers other than the API'
    required: true
  ses-region:
    description: 'AWS SES Region'
    required: true
  slack-webhook:
    description: 'Slack webhook URL'
    required: false
  sls-stage:
    description: 'Serverless Stage'
    required: false
  aws-os-username:
    description: 'AWS OS Username'
    required: true
  aws-os-password:
    description: 'AWS OS Password'
    required: true
  config-file:
    description: 'Serverless config file to deploy'
    required: false
    default: 'serverless.ts'
  package-suffix:
    description: 'Suffix appended to the package directory and artifact name'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup
      id: setup
      uses: ./.github/actions/setup-environment
      with:
        environment-name: ${{ inputs.environment-name }}
    - name: Download build output
      uses: actions/download-artifact@v4
      with:
        name: frontend-output-${{ inputs.environment-name }}
        path: .
    - name: Cache build typecheck output
      uses: ./.github/actions/cache-unplugged
    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.app }}${{ inputs.package-suffix }}-sls-package-${{ inputs.environment-name }}
        path: '${{ inputs.app }}${{ inputs.package-suffix }}-sls-package'
    # Serverless v3 bundles the EOL aws-sdk v2, whose S3 client stalls on
    # Node 24 (RequestTimeout, "idle connections will be closed") when
    # uploading deploy artifacts. The deployed Lambda runtime is still
    # nodejs24.x (set in serverless.ts) — only the deploy CLI runs on Node 20,
    # where aws-sdk v2 uploads work. Self-installing Node as a build tool is
    # explicitly supported by GitHub (separate from the JS-action runtime).
    # Pin 20.11.1: it predates the Node >=20.12 Yarn-PnP fs.rmSync bug
    # (yarnpkg/berry#6247) that otherwise crashes serverless' cleanupTempDir.
    - name: Install Node 20 for the deploy CLI
      shell: bash
      run: |
        curl -fsSL "https://nodejs.org/dist/v20.11.1/node-v20.11.1-linux-x64.tar.xz" -o /tmp/node20.tar.xz
        mkdir -p /tmp/node20
        tar -xJf /tmp/node20.tar.xz -C /tmp/node20 --strip-components=1 --no-same-owner
        /tmp/node20/bin/node --version
    - name: Deploy
      shell: bash
      run: |
        export PATH="/tmp/node20/bin:$PATH"
        node --version
        yarn workspace @asap-hub/${{ inputs.app }} run pnpify serverless deploy --config ${{ inputs.config-file }} --package $PWD/${{ inputs.app }}${{ inputs.package-suffix }}-sls-package
      env:
        ACTIVE_CAMPAIGN_ACCOUNT: ${{ inputs.active-campaign-account }}
        ACTIVE_CAMPAIGN_TOKEN: ${{ inputs.active-campaign-token }}
        ALGOLIA_INDEX: ${{ inputs.algolia-index }}
        AUTH0_AUDIENCE: ${{ inputs.auth0-audience }}
        AUTH0_CLIENT_ID: ${{ inputs.auth0-client-id }}
        AUTH0_SHARED_SECRET: ${{ inputs.auth0-shared-secret }}
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        AWS_ACM_CERTIFICATE_ARN: ${{ inputs.aws-acm-certificate-arn }}
        AWS_REGION: ${{ inputs.aws-region }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
        CONTENTFUL_ACCESS_TOKEN: ${{ inputs.contentful-access-token }}
        CONTENTFUL_ENV: ${{ inputs.contentful-env }}
        CONTENTFUL_MANAGEMENT_ACCESS_TOKEN: ${{ inputs.contentful-management-access-token }}
        CONTENTFUL_PREVIEW_ACCESS_TOKEN: ${{ inputs.contentful-preview-access-token }}
        CONTENTFUL_SPACE_ID: ${{ inputs.contentful-space-id }}
        CONTENTFUL_WEBHOOK_AUTHENTICATION_TOKEN: ${{ inputs.contentful-webhook-authentication-token }}
        CURRENT_REVISION: ${{ github.sha }}
        HOSTNAME: ${{ inputs.hostname }}
        NODE_ENV: 'production'
        NODE_OPTIONS: '--max-old-space-size=8192'
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        POSTMARK_SERVER_TOKEN: ${{ inputs.postmark-server-token }}
        SENTRY_DSN_API: ${{ inputs.sentry-dsn-api }}
        SENTRY_DSN_PUBLIC_API: ${{ inputs.sentry-dsn-public-api }}
        SENTRY_DSN_HANDLERS: ${{ inputs.sentry-dsn-handlers }}
        SES_REGION: ${{ inputs.ses-region }}
        SLACK_WEBHOOK: ${{ inputs.slack-webhook }}
        SLS_STAGE: ${{ inputs.sls-stage }}
        AWS_OS_USERNAME: ${{ inputs.aws-os-username }}
        AWS_OS_PASSWORD: ${{ inputs.aws-os-password }}
